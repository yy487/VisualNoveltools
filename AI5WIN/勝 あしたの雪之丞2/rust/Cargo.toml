[package]
name = "ai5win-tools"
version = "1.0.0"
edition = "2021"
description = "AI5WIN ARC/G24/MSK conversion and localization patch builder"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

