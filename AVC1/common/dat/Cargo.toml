[package]
name = "acv1_dat_tool"
version = "0.1.0"
edition = "2024"
description = "Unified ACV1 and legacy script.dat unpack/pack tool"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
encoding_rs = "0.8.35"
flate2 = "1.1.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true

