[package]
name = "kokoro2-ab-tool"
version = "0.1.0"
edition = "2021"
description = "Kokoro 2 AB bytecode analysis and round-trip validation tool"
license = "MIT"

[dependencies]
encoding_rs = "0.8.35"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[lib]
name = "kokoro2_ab"
path = "src/lib.rs"

[[bin]]
name = "ab_inspect"
path = "src/bin/ab_inspect.rs"

[[bin]]
name = "ab_extract"
path = "src/bin/ab_extract.rs"

[[bin]]
name = "ab_inject"
path = "src/bin/ab_inject.rs"
