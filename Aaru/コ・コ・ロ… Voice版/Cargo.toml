[package]
name = "kokorov-fl2-tool"
version = "0.1.0"
edition = "2021"
description = "KOKOROV FL2.0 archive and AB script localization tools"
license = "MIT"

[dependencies]
encoding_rs = "0.8.35"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[lib]
name = "kokorov_fl2"
path = "src/lib.rs"

[[bin]]
name = "fl2_unpack"
path = "src/bin/fl2_unpack.rs"
