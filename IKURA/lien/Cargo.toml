[package]
name = "lien-isf-tool"
version = "0.1.0"
edition = "2024"
description = "Structure-aware DRS/ISF localization tool for Lien"
license = "MIT"

[dependencies]
encoding_rs = "=0.8.35"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[lib]
name = "lien_isf"
path = "src/lib.rs"

[[bin]]
name = "lien-isf-tool"
path = "src/main.rs"

