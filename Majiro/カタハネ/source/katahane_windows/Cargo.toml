[package]
name = "katahane-windows-tool"
version = "0.1.0"
edition = "2021"
publish = false
description = "Archive and scenario tools for Katahane (Windows)"

[lib]
name = "katahane_windows_tool"
path = "src/lib.rs"

[[bin]]
name = "katahane-windows-tool"
path = "src/main.rs"

[dependencies]
encoding_rs = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
vn-cli = { path = "../vn_cli" }
vn-font = { path = "../vn_font" }
vn-text = { path = "../vn_text" }
