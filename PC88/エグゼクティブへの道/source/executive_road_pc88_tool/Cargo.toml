[package]
name = "executive-road-pc88-tool"
version = "0.1.0"
edition = "2021"
publish = false
description = "D88 disk splitter for Executive e no Michi (PC-88)"

[dependencies]
encoding_rs = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
vn-cli = { path = "../vn_cli" }
vn-font = { path = "../vn_font" }
vn-d88 = { path = "../vn_d88" }
vn-text = { path = "../vn_text" }

[profile.release]
lto = true
codegen-units = 1
strip = true
