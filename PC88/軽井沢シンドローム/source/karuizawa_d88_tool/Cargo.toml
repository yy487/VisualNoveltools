[package]
name = "karuizawa-d88-tool"
version = "0.1.0"
edition = "2021"
description = "N88-BASIC text export, 8px English font patching, and D88 rebuild for Karuizawa Syndrome (PC-8801)"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
vn-cli = { path = "../vn_cli" }
vn-d88 = { path = "../vn_d88" }

[lib]
name = "karuizawa_d88_tool"
path = "src/lib.rs"

[[bin]]
name = "karuizawa-d88-tool"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
