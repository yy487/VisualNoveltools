[package]
name = "mank-void-pc98"
version = "0.1.0"
edition = "2021"
publish = false
description = "38万公里的虚空 PC-98 text workspace and FDI rebuild tool"

[dependencies]
encoding_rs = "=0.8.35"
pc98-fdi-unpack = { path = "../pc98_fdi_unpack" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
vn-cli = { path = "../vn_cli" }
vn-font = { path = "../vn_font" }

[lib]
name = "mank_void_pc98"
path = "src/lib.rs"

[[bin]]
name = "38mank_void_pc98"
path = "src/main.rs"
