[package]
name = "lipstick-pc98"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fivec-new = { path = "../fivec_new" }
pc98-fdi-unpack = { path = "../pc98_fdi_unpack" }
vn-cli = { path = "../vn_cli" }
vn-text = { path = "../vn_text" }
vn-font = { path = "../vn_font" }

[lib]
name = "lipstick_pc98"

[[bin]]
name = "lipstick-pc98"
path = "src/main.rs"
