[package]
name = "jesus2-pc98"
version = "0.2.0"
edition = "2021"
publish = false
description = "PC-98 Jesus II text export, import, font and FDI rebuild tool"

[dependencies]
encoding_rs = "=0.8.35"
pc98-fdi-unpack = { path = "../pc98_fdi_unpack" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
vn-cli = { path = "../vn_cli" }
vn-font = { path = "../vn_font" }
vn-text = { path = "../vn_text" }

[[bin]]
name = "jesus2_pc98"
path = "src/main.rs"

