[package]
name = "pc98-fdi-unpack"
version = "0.2.0"
edition = "2021"
description = "Validated standard FDI/FAT12 unpack/rebuild library for PC-98 disk images"
license = "MIT"

[dependencies]
encoding_rs = "=0.8.35"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[lib]
name = "pc98_fdi_unpack"
path = "src/lib.rs"

[[bin]]
name = "fdi_unpack"
path = "src/main.rs"
