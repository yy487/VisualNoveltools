[package]
name = "fivec-new"
version = "0.1.0"
edition = "2021"
publish = false
description = "Read-only PC-88/PC-98 disk inspection and validated FAT12 extraction"

[dependencies]
encoding_rs = "=0.8.35"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
vn-cli = { path = "../vn_cli" }
vn-d88 = { path = "../vn_d88" }
vn-fdi = { path = "../vn_fdi" }
vn-sector-map = { path = "../vn_sector_map" }

[lib]
name = "fivec_new"
path = "src/lib.rs"

[[bin]]
name = "fivec_new"
path = "src/main.rs"
