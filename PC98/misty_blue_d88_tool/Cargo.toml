[package]
name = "misty-blue-d88-tool"
version = "0.2.0"
edition = "2021"
publish = false
description = "Misty Blue ENIX-DOS D88 text export, injection, repack and NP2 font tool"

[dependencies]
encoding_rs = "=0.8.35"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
vn-cli = { path = "../vn_cli" }
vn-d88 = { path = "../vn_d88" }
vn-font = { path = "../vn_font" }

[lib]
name = "misty_blue_d88_tool"
path = "src/lib.rs"

[[bin]]
name = "misty-blue-d88-tool"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
