[package]
name = "soft-hard-pc98"
version = "0.1.0"
edition = "2021"
publish = false
description = "PC-98 script translation and FDI rebuild tool for ソフトでハードな物語"

[dependencies]
encoding_rs = "=0.8.35"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
pc98-fdi-unpack = { path = "../pc98_fdi_unpack" }
vn-font = { path = "../vn_font" }
vn-cli = { path = "../vn_cli" }

[[bin]]
name = "soft_hard_pc98"
path = "src/main.rs"
