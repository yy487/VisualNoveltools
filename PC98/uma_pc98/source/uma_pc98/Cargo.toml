[package]
name = "uma-pc98"
version = "0.1.5"
edition = "2021"
publish = false
description = "Umanari PC-98 text translation and D88 rebuild"

[dependencies]
encoding_rs = "=0.8.35"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
fivec-new = { path = "../fivec_new" }
vn-cli = { path = "../vn_cli" }
vn-text = { path = "../vn_text" }
vn-font = { path = "../vn_font" }

[lib]
name = "uma_pc98"

[[bin]]
name = "uma_pc98"
path = "src/main.rs"
