[package]
name = "kerakera-pc98"
version = "0.1.0"
edition = "2024"

[dependencies]
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fivec-new = { path = "../fivec_new" }
vn-cli = { path = "../vn_cli" }
vn-text = { path = "../vn_text" }
vn-font = { path = "../vn_font" }

[lib]
name = "kerakera_pc98"

[[bin]]
name = "kerakera-pc98"
path = "src/main.rs"
