[package]
name = "aitsuno-area-text"
version = "0.2.0"
edition = "2021"
description = "Structured AREA text extractor and injector for Asoko no Shiawase"
license = "MIT"

[dependencies]
encoding_rs = "=0.8.35"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[lib]
name = "aitsuno_area_text"
path = "src/lib.rs"

[[bin]]
name = "area_text"
path = "src/main.rs"
