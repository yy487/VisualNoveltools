[package]
name = "aitsuno-fdi-pack"
version = "0.2.0"
edition = "2021"
description = "Validated FDI/FAT12 repacker for PC-98 disk images"
license = "MIT"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[lib]
name = "aitsuno_fdi_pack"
path = "src/lib.rs"

[[bin]]
name = "fdi_pack"
path = "src/main.rs"
