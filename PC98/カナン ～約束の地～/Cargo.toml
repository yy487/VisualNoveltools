[package]
name = "canaan-tools"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "=4.6.1", features = ["derive"] }
encoding_rs = "=0.8.35"
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
thiserror = "=2.0.18"

[[bin]]
name = "unpack"
path = "src/bin/unpack.rs"

[[bin]]
name = "pack"
path = "src/bin/pack.rs"

[[bin]]
name = "build_hdi"
path = "src/bin/build_hdi.rs"

[[bin]]
name = "extract"
path = "src/bin/extract.rs"

[[bin]]
name = "inject"
path = "src/bin/inject.rs"
