[package]
name = "cyber-illusion-pc98"
version = "0.1.0"
edition = "2021"
publish = false
description = "Cyber Illusion PC-98 script extraction and reinjection tool"

[dependencies]
encoding_rs = "=0.8.35"
iced-x86 = { version = "=1.21.0", default-features = false, features = ["decoder", "instr_info", "std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
vn-cli = { path = "../vn_cli" }
vn-font = { path = "../vn_font" }
vn-text = { path = "../vn_text" }

[lib]
name = "cyber_illusion_pc98"
path = "src/lib.rs"

[[bin]]
name = "cyber_illusion_pc98"
path = "src/main.rs"
