[package]
name = "yoshinaga-sayuri-pc98"
version = "0.3.0"
edition = "2021"
publish = false

[dependencies]
encoding_rs = "=0.8.35"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
fivec-new = { path = "../fivec_new" }
vn-cli = { path = "../vn_cli" }
vn-text = { path = "../vn_text" }
vn-font = { path = "../vn_font" }
platinum-star-hdi-tool = { path = "../platinum_star_hdi_tool" }

[lib]
name = "yoshinaga_sayuri_pc98"
path = "src/lib.rs"

[[bin]]
name = "yoshinaga_sayuri_pc98"
path = "src/main.rs"
