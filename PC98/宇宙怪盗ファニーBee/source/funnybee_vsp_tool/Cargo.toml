[package]
name = "funnybee-vsp-tool"
version = "0.1.0"
edition = "2021"
description = "Recursive AliceSoft VSP to PNG converter for FunnyBee"
license = "MIT"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[lib]
name = "funnybee_vsp_tool"
path = "src/lib.rs"

[[bin]]
name = "funnybee_vsp_tool"
path = "src/main.rs"
