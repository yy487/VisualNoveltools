[package]
name = "shinjuku-d88-tool"
version = "0.2.0"
edition = "2021"
description = "D88/FAT12, MES translation, repack and NP2 font tool for Shinjuku Monogatari (PC-98)"
license = "MIT"

[dependencies]
encoding_rs = "=0.8.35"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
vn-cli = { path = "../vn_cli" }
vn-font = { path = "../vn_font" }

[lib]
name = "shinjuku_d88_tool"
path = "src/lib.rs"

[[bin]]
name = "shinjuku-d88-tool"
path = "src/main.rs"
