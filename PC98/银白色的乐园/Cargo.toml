[package]
name = "chrome-paradise-pc98"
version = "0.1.0"
edition = "2021"
publish = false
description = "Chrome Paradise PC-98 D88/FAT12 unpack workflow"

[dependencies]
fivec-new = { path = "../common/磁盘镜像工具" }
encoding_rs = "0.8"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
vn-cli = { path = "../common/vn_cli" }
vn-d88 = { path = "../common/vn_d88" }
vn-sector-map = { path = "../common/vn_sector_map" }
sha2 = "0.10"
vn-font = { path = "../common/vn_font" }

[lib]
name = "chrome_paradise_pc98"
path = "src/lib.rs"

[[bin]]
name = "chrome_paradise_pc98"
path = "src/main.rs"
