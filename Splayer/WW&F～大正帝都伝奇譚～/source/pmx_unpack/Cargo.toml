[package]
name = "pmx_unpack"
version = "0.3.0"
edition = "2021"
description = "Archive and text localization tools for Splayer PMX files"
license = "MIT"

[dependencies]
encoding_rs = "=0.8.35"
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
