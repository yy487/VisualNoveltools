[package]
name = "sinfonia-script-tool"
version = "0.1.0"
edition = "2021"
description = "Structure-aware extraction and CSTR injection for an AGSI SB2 script bundle"
license = "MIT"

[dependencies]
encoding_rs = "0.8.35"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"

[profile.release]
strip = true
lto = true
codegen-units = 1
