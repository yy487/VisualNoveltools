[package]
name = "railsoft-xfl-tool"
version = "0.1.0"
edition = "2024"
description = "XFL and GSC localization tools for Benigara Machi Hakubutsushi"
license = "MIT"

[dependencies]
encoding_rs = "0.8.35"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[[bin]]
name = "railsoft-xfl"
path = "src/main.rs"

[[bin]]
name = "xfl_unpack"
path = "src/bin/xfl_unpack.rs"

[[bin]]
name = "xfl_pack"
path = "src/bin/xfl_pack.rs"

[[bin]]
name = "gsc_extract"
path = "src/bin/gsc_extract.rs"

[[bin]]
name = "gsc_inject"
path = "src/bin/gsc_inject.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
