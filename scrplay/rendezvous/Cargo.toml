[package]
name = "rendezvous-scr"
version = "0.2.0"
edition = "2024"
description = "Structure-aware SCR:2005 version 5 text extractor and injector"
license = "MIT"

[dependencies]
encoding_rs = "0.8.35"
serde = { version = "1.0.219", features = ["derive"] }
