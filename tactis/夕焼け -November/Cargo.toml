[package]
name = "yuyake-mes-tools"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
encoding_rs = "0.8.35"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "extract"
path = "src/bin/extract.rs"

[[bin]]
name = "inject"
path = "src/bin/inject.rs"

