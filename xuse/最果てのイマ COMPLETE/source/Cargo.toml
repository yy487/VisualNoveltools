[package]
name = "farthest2015-cd-tool"
version = "0.1.2"
edition = "2021"
description = "Structure-aware JSON text extraction and injection for Farthest2015 .cd files"
license = "MIT"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
encoding_rs = "0.8.35"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[profile.release]
lto = true
codegen-units = 1
strip = true
